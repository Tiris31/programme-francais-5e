<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Île aux mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: joyeux, clair, encourageant ; un jeu pour un collégien qui débute en français
   IDEA: une carte au trésor d'archipel ; chaque île est une étape du programme de 5e
   PICTURE: la carte SVG, le renard-héros posé sur la semaine en cours
   COLOUR and TYPE: mer turquoise, sable, corail ; Baloo 2 pour les titres, Atkinson Hyperlegible pour lire
   LAYOUT: barre haute, carte, gros bouton de mission ; la mission occupe tout l'écran, une chose à la fois */
:root{color-scheme:light dark;
--sea:light-dark(#17a39a,#0b3f3d);--sea2:light-dark(#11877f,#082f2e);
--card:light-dark(#ffffff,#132a2c);--ink:light-dark(#13263b,#eaf6f4);--soft:light-dark(#566676,#a9c2c0);
--sand:#ffd27a;--coral:#ff6b4a;--coral2:#e5532f;--good:light-dark(#178a4a,#4ade80);--bad:light-dark(#c9322a,#ff7b6e);
--line:light-dark(#dbe5e8,#2a4b4e);--chip:light-dark(#eef7f6,#1b393b);--m:light-dark(#1f5fd1,#7fb0ff);--f:light-dark(#d1243f,#ff8597)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--sea);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
h1,h2,.title{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;gap:12px;padding:14px max(4vw,14px);color:#fff;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,36px);font-weight:800;margin-right:auto}
.pill{background:rgba(255,255,255,.18);border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.pbtn{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:8px 16px;font-weight:700;min-height:44px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,14px) 40px}
.mapbox{background:var(--sea2);border-radius:24px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.mapbox svg{display:block;width:100%;height:auto}
.panel{background:var(--card);border-radius:24px;padding:clamp(18px,3vw,32px);margin-top:16px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.go{background:var(--coral);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;border-radius:18px;padding:12px 26px;min-height:56px;box-shadow:0 5px 0 var(--coral2);transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral2)}
.go.big{width:100%;font-size:clamp(22px,3.4vw,30px);padding:18px}
.sec{background:var(--chip);color:var(--ink);font-weight:700;border-radius:14px;padding:10px 18px;min-height:48px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.weeks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wk{background:var(--chip);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700;font-size:15px}
.wk.cur{background:var(--sand);color:#13263b}
.muted{color:var(--soft);font-size:15px}
.kicker{font-weight:700;color:var(--coral);margin:0 0 6px;font-size:15px}
/* mission */
.mbar{display:flex;align-items:center;gap:12px;padding:12px max(4vw,14px);color:#fff}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:34px;height:10px;border-radius:9px;background:rgba(255,255,255,.3)}
.dots i.on{background:var(--sand)}.dots i.done{background:#fff}
.clock{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.clock svg{width:38px;height:38px}
.stage{background:var(--card);border-radius:28px;max-width:860px;margin:0 auto;padding:clamp(20px,4vw,40px);min-height:60vh;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.stage h2{font-size:clamp(30px,5vw,46px);font-weight:800}
.big{font-size:clamp(22px,3.2vw,28px);margin:14px 0 4px}
.hint{color:var(--soft);margin:8px 0 0}
.wcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:24px;background:var(--chip);margin-top:14px}
.pic{font-size:clamp(84px,16vw,130px);line-height:1.1}
.noimg{font-family:"Baloo 2";font-size:64px;color:var(--soft)}
.word{font-family:"Baloo 2";font-weight:800;font-size:clamp(36px,7vw,58px);line-height:1.1;text-align:center}
.m{color:var(--m)}.f{color:var(--f)}
.spk{display:none;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--sand);color:#13263b;flex:none}
.spk svg{width:28px;height:28px}
.spk.huge{width:110px;height:110px}.spk.huge svg{width:54px;height:54px}
body.voice .spk{display:inline-flex}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--chip);border:3px solid var(--line);border-radius:18px;padding:14px 12px;min-height:70px;font-size:clamp(20px,3vw,26px);font-weight:700;transition:transform .08s}
.opt:hover{border-color:var(--sea)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.fbok{color:var(--good);font-family:"Baloo 2";font-weight:800;font-size:28px;margin:16px 0 0}
.fbno{color:var(--bad);font-weight:700;margin:16px 0 8px}
.q{font-size:clamp(24px,4vw,34px);font-weight:700;margin:14px 0 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--coral);margin:0 .15em}
.model{font-size:clamp(22px,3.4vw,30px);font-weight:700;background:var(--chip);border-radius:18px;padding:16px 20px;margin:14px 0 0}
.text{font-size:clamp(21px,3vw,27px);line-height:1.85;margin-top:14px}
.text span{border-radius:8px;padding:2px 3px;transition:background .2s}
.text span.cur{background:var(--sand);color:#13263b}
.text span.read{color:var(--soft)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tile{background:var(--chip);border:3px solid var(--line);border-radius:14px;padding:10px 16px;font-size:22px;font-weight:700;min-height:56px}
.tile[disabled]{opacity:.25}
.line{min-height:72px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:24px;font-weight:700;margin-top:16px}
.stars{display:flex;gap:10px;justify-content:center;margin:12px 0}
.stars svg{width:clamp(56px,12vw,84px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips>span{background:var(--chip);border-radius:99px;padding:6px 14px;font-weight:700}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px;max-width:440px}
.week7 div{aspect-ratio:1;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--soft)}
.week7 div.on{background:var(--sand);color:#13263b}
.poem{line-height:1.75}.gl span{font-weight:400;font-size:15px}.cw{cursor:pointer}.cw.last{background:var(--coral);color:#fff}.cw.err{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px;background:rgba(201,50,42,.15)}
.cw.after{opacity:.35}
.count{font-family:"Baloo 2";font-weight:800;font-size:clamp(64px,14vw,110px);text-align:center;color:var(--coral);line-height:1}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:15px}
.bar b{display:block;height:18px;border-radius:9px;background:var(--sea)}
.bar span:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
label{font-weight:700;display:block;margin-top:16px}
input[type=text],select{font:inherit;font-size:17px;width:100%;max-width:360px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);min-height:48px;margin-top:6px}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}
.chk input{width:24px;height:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
h3{font-family:"Baloo 2";font-size:24px;margin:22px 0 4px}
.fox{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.fox{animation:none}.go,.opt{transition:none}}
@media(max-width:600px){.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}.dots i{width:22px}.mbar .pbtn{padding:8px 12px}}
</style>
</head>

{n:5,title:"Le Loup et l'Agneau",isle:1,

 ex:{t:"Le Loup et l'Agneau",src:"Jean de La Fontaine, Fables, livre I (1668) · début de la fable",lines:["La raison du plus fort est toujours la meilleure :","Nous l'allons montrer tout à l'heure.","Un Agneau se désaltérait","Dans le courant d'une onde pure.","Un Loup survient à jeun, qui cherchait aventure,","Et que la faim en ces lieux attirait.","« Qui te rend si hardi de troubler mon breuvage ?","Dit cet animal plein de rage :","Tu seras châtié de ta témérité. »"],gl:[["se désaltérait","buvait"],["onde pure","eau propre"],["à jeun","sans avoir mangé"],["breuvage","boisson"]],q:["Dans le vrai texte, que fait l'agneau ?",["il boit","il dort","il mange"],0]},

{n:6,title:"La Cigale et la Fourmi",isle:1,

 qs:[["Que fait la cigale en été ?",["elle chante","elle travaille","elle dort"],0],["Que fait la fourmi ?",["elle travaille","elle danse","elle chante"],0],["En hiver, il fait…",["froid","chaud","beau"],0]],

 const intro=()=>{if(i>=fresh.length)return quiz();const x=fresh[i];stage(`<p class="kicker">2 · Cartes-mots · nouveau mot ${i+1} sur ${fresh.length}</p><div class="wcard"><div class="pic">${x.e||'<span class="noimg">Aa</span>'}</div><div class="word">${det(x)}</div></div><p class="hint">Écoute et répète le mot.</p><div class="row">${spk(x.l)}<button class="go" data-a="g">Je répète</button></div>`);say(x.l);ACT.g=()=>{S.boxes[x.l]=1;i++;intro()}};
 const quiz=()=>{let pool=[...new Set([...M.fresh,...shuffle(due(M.wk))])].slice(0,8);if(pool.length<8)pool=pool.concat(shuffle(words.map(x=>x.l).filter(l=>!pool.includes(l)))).slice(0,8);pool=shuffle(pool);let k=0;
  const ask=()=>{if(k>=pool.length){save();return next()}const x=W(ALL[pool[k]].raw);const same=WEEKS[ALL[x.l].wk-1].words.map(W).filter(y=>y.l!==x.l);const types=["hear"];if(x.e)types.push("pic","pic");if(x.gen==="m"||x.gen==="f")types.push("genre");const ty=pick(types);
   const rec=ok=>{S.boxes[x.l]=ok?Math.min(5,(S.boxes[x.l]||1)+1):1};const nx=()=>{k++;ask()};const kick=`<p class="kicker">2 · Cartes-mots · ${k+1} sur ${pool.length}</p>`;
   if(ty==="genre"){choices(kick+`<div class="wcard"><div class="pic">${x.e||'<span class="noimg">Aa</span>'}</div><div class="word">${esc(x.bare)}</div></div><p class="q">un ou une ?</p>`,["un","une"],x.gen==="m"?0:1,{rec,next:nx,say:(x.gen==="m"?"un ":"une ")+x.bare});return}
   const pool2=(ty==="pic"?same.filter(y=>!y.e||y.e!==x.e):same);const ds=shuffle(pool2).slice(0,3);const opts=shuffle([x,...ds]);const ai=opts.indexOf(x);
   if(ty==="pic")choices(kick+`<div class="wcard"><div class="pic">${x.e}</div></div><p class="q">Quel est ce mot ?</p>`,opts.map(det),ai,{rec,next:nx,say:x.l});
   else{choices(kick+`<div class="row" style="justify-content:center">${spk(x.l,"huge")}</div><p class="q" style="text-align:center">Écoute. Quel mot entends-tu ?</p>`,opts.map(det),ai,{rec,next:nx,say:x.l});say(x.l)}};
  ask()};
 intro()}
function sentences(t){return t.split(/(?<=[.!?…»])\s+(?=[A-ZÀ-ÖÉ«—])/)}
function stepRead(){const w=M.w,ss=sentences(fill(w.text));let i=0;
 const draw=()=>{stage(`<p class="kicker">3 · Lecture · ${esc(w.title)}</p><p class="hint" style="margin-top:0">${MODES[new Date().getDay()]}</p><div class="text">${ss.map((s,j)=>`<span class="${j===i?'cur':j<i?'read':''}">${esc(s)}</span>`).join(" ")}</div><div class="row">${i<ss.length?spk(ss[i])+`<button class="go" data-a="r">Phrase lue (${i+1} sur ${ss.length})</button>`:`<button class="go" data-a="q">Questions</button>`}<button class="sec" data-a="c">Chrono 1 minute</button></div>`);
  ACT.r=()=>{i++;draw()};ACT.q=()=>questions(0);ACT.c=()=>chrono(M.wk,()=>questions(0))};
 const questions=k=>{if(k>=w.qs.length)return w.ex?extract():next();const [q,o,ai]=w.qs[k];const opts=o.map(fill);const order=shuffle(opts.map((_,j)=>j));const qq=fill(q);
  choices(`<p class="kicker">3 · Lecture · question ${k+1} sur ${w.qs.length}</p><p class="q">${esc(qq)}</p><div class="row">${spk(qq)}</div>`,order.map(j=>esc(opts[j])),order.indexOf(ai),{next:()=>questions(k+1),say:opts[ai]})};
 const extract=()=>{const ex=w.ex,all=ex.lines.filter(l=>l!=="[…]").join(" ");let j=0;
  const dr=()=>{stage(`<p class="kicker">3 · Lecture · le vrai texte</p><h2 style="font-size:clamp(26px,4vw,38px)">${esc(ex.t)}</h2><p class="muted">${esc(ex.src)}. Écoute chaque ligne, puis répète-la.</p><div class="text poem">${ex.lines.map((l,i)=>`<span class="${i===j?'cur':i<j?'read':''}">${esc(l)}</span>`).join("<br>")}</div><div class="chips gl">${ex.gl.map(g=>`<span><b>${esc(g[0])}</b> = ${esc(g[1])}</span>`).join("")}</div><div class="row">${j<ex.lines.length?spk(ex.lines[j])+`<button class="go" data-a="l">Ligne lue (${j+1} sur ${ex.lines.length})</button>`:`<button class="go" data-a="q">Une question</button>`}<button class="sec" data-say="${esc(all)}">Écouter tout</button><button class="sec" data-a="skip">Plus tard</button></div>`);
   ACT.l=()=>{j++;if(ex.lines[j]==="[…]")j++;dr()};ACT.skip=next;
   ACT.q=()=>{const [q,o,ai]=ex.q,order=shuffle(o.map((_,i)=>i));choices(`<p class="kicker">3 · Lecture · le vrai texte</p><p class="q">${esc(q)}</p>`,order.map(i=>esc(o[i])),order.indexOf(ai),{next,say:o[ai]})}};
  dr()};
 draw()}
function stepGram(){const w=M.w;stage(`<p class="kicker">4 · Grammaire</p><h2>${esc(w.rule.t)}</h2><p class="model">${esc(w.rule.m)}</p><div class="row">${spk(w.rule.m)}<button class="go" data-a="g">C'est parti</button></div>`);
 const items=shuffle(w.gram).slice(0,5);let k=0;
 const ask=()=>{if(k>=items.length)return next();const it=items[k],nx=()=>{k++;ask()},kick=`<p class="kicker">4 · Grammaire · ${k+1} sur ${items.length}</p>`;
  if(it.b)return build(it.b,kick,nx);const [q,o,ai,punct]=it;const shown=punct?esc(q)+' <span class="blank"></span>':esc(q).replace("___",'<span class="blank"></span>');
  const full=punct?q+(o[ai]==="."?".":" "+o[ai]):q.replace(/\s*\(.*\)$/,"").replace("___",o[ai]).replace("' ","'").replace(/^l'\s/,"l'");
  const order=punct?[0,1,2]:shuffle(o.map((_,j)=>j));choices(kick+`<p class="q">${shown}</p>`,order.map(j=>esc(o[j])),order.indexOf(ai),{next:nx,say:full},o.length===3?"three":"")};
 ACT.g=ask}
function build(parts,kick,nx){const tiles=shuffle(parts.map((p,i)=>i));let got=[];
 const draw=()=>{stage(kick+`<p class="q">Remets les mots dans l'ordre.</p><div class="line">${got.map(i=>esc(parts[i])).join(" ")||'<span class="muted">Touche les mots…</span>'}</div><div class="tiles">${tiles.map(i=>`<button class="tile" data-a="t" data-i="${i}" ${got.includes(i)?"disabled":""}>${esc(parts[i])}</button>`).join("")}</div><div class="row"><button class="sec" data-a="x">Effacer</button></div><div id="fb"></div>`);
  ACT.t=b=>{const i=+b.dataset.i;if(got.includes(i))return;got.push(i);if(got.length<parts.length)return draw();const ok=got.every((g,j)=>g===j);M.tot++;if(ok)M.ok++;beep(ok);const full=parts.join(" ");draw();setTimeout(()=>say(full),250);
   if(ok){$("#fb").innerHTML=`<p class="fbok">${pick(BRAVO)}</p>`;ACT={};setTimeout(nx,1500)}else{$("#fb").innerHTML=`<p class="fbno">Presque ! La bonne phrase : « ${esc(full)} »</p><button class="go" data-a="cont">Continuer</button>`;ACT={cont:nx}}};
  ACT.x=()=>{got=[];draw()}};
 draw()}
function stepWin(){stopTimer();const r=M.tot?M.ok/M.tot:1,st=r>=.85?3:r>=.6?2:1;S.missions[M.wk]=(S.missions[M.wk]||0)+1;const t=tk(new Date());if(!S.days.includes(t))S.days.push(t);save();
 const d=new Date(),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const cells=["L","M","M","J","V","S","D"].map((l,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return `<div class="${S.days.includes(tk(x))?'on':''}">${l}</div>`}).join("");
 stage(`<p class="kicker">5 · Victoire</p><h2>Bravo ${esc(nm())} !</h2><div class="stars">${STAR(st>=1)+STAR(st>=2)+STAR(st>=3)}</div><p class="big" style="text-align:center">${M.ok} bonnes réponses sur ${M.tot}</p>${M.fresh.length?`<p class="hint">Ce soir, j'ai appris :</p><div class="chips">${M.fresh.map(l=>`<span>${det(W(ALL[l].raw))}</span>`).join("")}</div>`:""}<p class="hint" style="margin-top:18px">Ma semaine :</p><div class="week7">${cells}</div><p class="muted" style="margin-top:10px">${streak()} soir${streak()>1?"s":""} d'affilée. Reviens demain !</p><div class="row"><button class="go" data-a="home">Retour à la carte</button></div>`)}
/* chrono */
function showChrono(wk){place="chrono";view.innerHTML=`<div class="mbar"><div class="dots"></div><button class="pbtn" data-a="home">Carte</button></div><main class="wrap"><section class="stage" id="stage"></section></main>`;M=M||{};chrono(wk,showMap)}
function chrono(wk,done){const w=WEEKS[wk-1],toks=fill(w.text).split(/\s+/),isW=t=>/[A-Za-zÀ-ÿ0-9]/.test(t);let left=60,last=-1,errs=new Set(),phase="ready",iv=null,t0=0,scale=1;
 const n=()=>{let c=0;for(let i=0;i<=last;i++)if(isW(toks[i])&&!errs.has(i))c++;return c};
 const txt=()=>`<div class="text">${toks.map((t,i)=>`<span class="cw ${i===last?'last':''} ${errs.has(i)?'err':''} ${last>=0&&i>last?'after':''}" data-a="w" data-i="${i}">${esc(t)}</span>`).join(" ")}</div>`;
 const draw=()=>{let h=`<p class="kicker">Chrono lecture · semaine ${wk}</p>`;
  if(phase==="ready")h+=`<h2>1 minute pour lire</h2><p class="hint">Appuie sur Go, puis lis le texte à voix haute. L'adulte écoute.</p><div class="row"><button class="go" data-a="go">Go !</button></div>`+txt();
  if(phase==="run")h+=`<div class="count">${left}</div><div class="row"><button class="sec" data-a="fin">J'ai fini le texte</button></div>`+txt();
  if(phase==="last")h+=`<h2>Stop !</h2><p class="hint">Adulte : touchez le dernier mot lu, puis les mots ratés. Ensuite, validez.</p><div class="row"><button class="go" data-a="ok" ${last<0?"disabled":""}>Valider : ${n()} mots</button></div>`+txt();
  if(phase==="res"){const hist=S.flu.filter(f=>f.w===wk),score=hist[hist.length-1].n,first=hist[0].n;h+=`<h2>${score} mots par minute</h2><p class="big">${hist.length>1?(score>=first?`+${score-first} depuis ton premier chrono de la semaine !`:"Continue, ça va monter !"):"Premier chrono de la semaine : bravo !"}</p>${fluBars()}<div class="row"><button class="go" data-a="bk">Continuer</button></div>`}
  stage(h);
  ACT.go=()=>{phase="run";t0=Date.now();left=60;draw();iv=setInterval(()=>{if(!$("#stage")){clearInterval(iv);return}left--;const c=$(".count");if(c)c.textContent=left;if(left<=0){clearInterval(iv);beep(true);phase="last";draw()}},1000)};
  ACT.fin=()=>{clearInterval(iv);last=toks.length-1;scale=60/Math.max(20,(Date.now()-t0)/1000);phase="last";draw()};
  ACT.w=b=>{if(phase!=="last")return;const i=+b.dataset.i;if(last<0||i>last)last=i;else if(i!==last){errs.has(i)?errs.delete(i):errs.add(i)}draw()};
  ACT.ok=()=>{if(last<0)return;S.flu.push({d:tk(new Date()),w:wk,n:Math.round(n()*scale)});save();phase="res";draw()};
  ACT.bk=()=>{clearInterval(iv);done()}};
 draw()}
function fluBars(){const h=S.flu.slice(-8);if(!h.length)return '<p class="muted">Pas encore de chrono.</p>';const mx=Math.max(...h.map(f=>f.n),1);return `<div class="bars">${h.map(f=>`<div class="bar"><span>${f.d.slice(8)}/${f.d.slice(5,7)} · S${f.w}</span><span><b style="width:${Math.max(4,f.n/mx*100)}%"></b></span><span>${f.n}</span></div>`).join("")}</div>`}
/* parent */
function showParent(){place="parent";ACT={};const box=[1,2,3,4,5].map(b=>Object.values(S.boxes).filter(v=>v===b).length),mb=Math.max(...box,1);
 view.innerHTML=topBar()+`<main class="wrap"><div class="panel"><h2 class="title" style="font-size:36px">Espace parent</h2><p class="muted" id="sync">${dbRef?"La progression est enregistrée dans votre compte Claude.":"La progression est enregistrée dans ce navigateur."}</p>
 <div class="grid2"><div><label for="pn">Prénom de l'enfant</label><input type="text" id="pn" value="${esc(S.name)}" placeholder="Adam" autocomplete="off">
 <label for="wk">Semaine du programme</label><select id="wk">${WEEKS.map(w=>`<option value="${w.n}" ${w.n===S.week?"selected":""}>Semaine ${w.n} · ${esc(w.title)}</option>`).join("")}</select>
 <label for="vc">Voix (accent français)</label><select id="vc" data-n="${frVoices.length}"><option value="">Automatique : meilleure voix de France</option>${frVoices.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}${tts?`<option value="claude" ${S.voice==="claude"?"selected":""}>Voix Claude</option>`:""}</select>
 <p class="muted" style="margin:6px 0 0">${frVoices.some(v=>/^fr[-_]FR/i.test(v.lang))?"Une voix française de France est installée sur cet appareil.":"Aucune voix française de France sur cet appareil : ajoutez-en une dans les réglages de langue de l'ordinateur ou du téléphone, ou utilisez Chrome."}</p>
 <div class="row" style="margin-top:10px"><button class="sec" data-say="Bonjour ! Bienvenue sur l'Île aux mots. Le renard t'attend.">Écouter un exemple</button></div>
 <label class="chk"><input type="checkbox" id="sl" ${S.slow?"checked":""}> Voix lente</label>
 <h3>Missions par semaine</h3><div class="bars">${WEEKS.map(w=>`<div class="bar"><span>S${w.n}</span><span><b style="width:${Math.min(100,(S.missions[w.n]||0)/7*100)}%"></b></span><span>${S.missions[w.n]||0}</span></div>`).join("")}</div></div>
 <div><h3>Boîte à mots</h3><p class="muted">Case 1 : mots nouveaux ou oubliés. Case 5 : mots sus.</p><div class="bars">${box.map((c,i)=>`<div class="bar"><span>Case ${i+1}</span><span><b style="width:${c/mb*100}%"></b></span><span>${c}</span></div>`).join("")}</div>
 <h3>Chrono lecture (mots par minute)</h3>${fluBars()}
 <h3>Recommencer</h3><p class="muted">Efface toute la progression de ce jeu.</p><div class="row" id="rz"><button class="sec" data-a="r1">Effacer la progression</button></div></div></div>
 <div class="row"><button class="go" data-a="home">Retour à la carte</button></div></div></main>`;
 $("#pn").addEventListener("change",e=>{S.name=e.target.value.slice(0,30);save()});
 $("#wk").addEventListener("change",e=>{S.week=+e.target.value;save()});
 $("#vc").addEventListener("change",e=>{S.voice=e.target.value;save()});
 $("#sl").addEventListener("change",e=>{S.slow=e.target.checked;save()});
 ACT.r1=()=>{$("#rz").innerHTML=`<button class="go" data-a="r2">Oui, tout effacer</button><button class="sec" data-a="parent">Annuler</button>`};
 ACT.r2=()=>{const n=S.name;S=clone(DEF);S.name=n;save();showParent()}}
/* démarrage + capacités */
showMap();
(async()=>{try{if(!window.claude||!claude.use)return;const t=await claude.use("tts");if(t){tts=t;document.body.classList.add("voice")}}catch(e){}})();
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use("db"),u=await claude.use("user");if(!db||!u)return;const id=await u.id();if(!id)return;const ref=db.doc("data/users/"+id+"/progress");
 const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);dbRef=ref;
 if(snap.exists){const d=snap.data();if(d&&d.v===1&&(d.updated||0)>(S.updated||0)){S=Object.assign(clone(DEF),clone(d));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(place==="map")showMap();if(place==="parent")showParent()}}
 else if(S.updated)save();const sy=$("#sync");if(sy)sy.textContent="La progression est enregistrée dans votre compte Claude."}catch(e){}})();
}
</script>
